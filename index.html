<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LedgerCool // Small Business Accounting</title>
    <style>
        :root {
            --bg-base: #0f172a;
            --bg-surface: #1e293b;
            --bg-element: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-teal: #14b8a6;
            --accent-blue: #06b6d4;
            --accent-indigo: #6366f1;
            --income-green: #10b981;
            --expense-rose: #f43f5e;
            --border-color: #475569;
            --radius-lg: 12px;
            --radius-md: 8px;
            --font-stack: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-stack);
            line-height: 1.5;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.05em;
            background: linear-gradient(to right, var(--accent-teal), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-sub {
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        /* Summary Cards Grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
        }

        .card.income::before { background-color: var(--income-green); }
        .card.expense::before { background-color: var(--expense-rose); }
        .card.net::before { background-color: var(--accent-indigo); }

        .card-label {
            font-size: 0.875rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .card-value {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        /* Workspace Grid Split */
        .workspace-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        @media (min-width: 900px) {
            .workspace-grid {
                grid-template-columns: 350px 1fr;
            }
        }

        /* Controls / Forms Pane */
        .pane {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            height: max-content;
        }

        .pane-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            color: var(--text-main);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 0.375rem;
        }

        .form-control {
            width: 100%;
            background-color: var(--bg-base);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-main);
            padding: 0.625rem 0.75rem;
            font-family: var(--font-stack);
            font-size: 0.95rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.2);
        }

        .btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-top: 1.25rem;
        }

        .btn {
            width: 100%;
            padding: 0.625rem 1rem;
            border: none;
            border-radius: var(--radius-md);
            font-family: var(--font-stack);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.1s ease;
            color: #ffffff;
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-income { background-color: var(--income-green); }
        .btn-expense { background-color: var(--expense-rose); }
        .btn-secondary { 
            background-color: var(--bg-element); 
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn:hover {
            opacity: 0.9;
        }

        /* Data Visualization Pane Layout */
        .data-layout {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .chart-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
        }

        #categoryChart {
            max-width: 100%;
            height: auto;
        }

        /* Table & Filters Styling */
        .table-toolbar {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        @media (min-width: 600px) {
            .table-toolbar {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .filter-group {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            background-color: var(--bg-surface);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.95rem;
        }

        th, td {
            padding: 0.875rem 1.25rem;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: rgba(255, 255, 255, 0.02);
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: rgba(255, 255, 255, 0.01);
        }

        .tag {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .tag-income { background-color: rgba(16, 185, 129, 0.15); color: var(--income-green); }
        .tag-expense { background-color: rgba(244, 63, 94, 0.15); color: var(--expense-rose); }

        .text-income { color: var(--income-green); font-weight: 600; }
        .text-expense { color: var(--expense-rose); font-weight: 600; }

        .btn-delete {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.25rem;
            border-radius: 4px;
            transition: color 0.2s, background-color 0.2s;
        }

        .btn-delete:hover {
            color: var(--expense-rose);
            background-color: rgba(244, 63, 94, 0.1);
        }

        .empty-state {
            padding: 3rem;
            text-align: center;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        
        <header>
            <div>
                <h1>BizLedger</h1>
                <div class="brand-sub">Core Business Financial Intelligence</div>
            </div>
            <div>
                <button class="btn btn-secondary" onclick="exportCSV()">Export CSV</button>
            </div>
        </header>

        <section class="metrics-grid">
            <div class="card income">
                <span class="card-label">Total Revenue</span>
                <span class="card-value" id="totalRevenue">$0.00</span>
            </div>
            <div class="card expense">
                <span class="card-label">Total Expenses</span>
                <span class="card-value" id="totalExpenses">$0.00</span>
            </div>
            <div class="card net">
                <span class="card-label">Net Operating Margin</span>
                <span class="card-value" id="netProfit">$0.00</span>
            </div>
        </section>

        <section class="workspace-grid">
            
            <div class="pane">
                <div class="pane-title">Record Transaction</div>
                <form id="txForm" onsubmit="handleFormSubmit(event)">
                    <div class="form-group">
                        <label for="txDate">Date</label>
                        <input type="date" id="txDate" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="txDesc">Description / Vendor</label>
                        <input type="text" id="txDesc" class="form-control" placeholder="e.g., Cloud Hosting" required>
                    </div>

                    <div class="form-group">
                        <label for="txCategory">Accounting Category</label>
                        <select id="txCategory" class="form-control" required>
                            <option value="Sales">Sales Revenue</option>
                            <option value="Consulting">Consulting Income</option>
                            <option value="Software">Software/SaaS Infrastructure</option>
                            <option value="Marketing">Marketing & Advertising</option>
                            <option value="Rent">Rent & Workspace</option>
                            <option value="Salaries">Payroll & Contractors</option>
                            <option value="Operations">General Operations</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="txAmount">Amount ($)</label>
                        <input type="number" id="txAmount" class="form-control" step="0.01" min="0.01" placeholder="0.00" required>
                    </div>

                    <div class="btn-row">
                        <button type="button" class="btn btn-income" onclick="submitAs('income')">+ Income</button>
                        <button type="button" class="btn btn-expense" onclick="submitAs('expense')">- Expense</button>
                    </div>
                </form>
            </div>

            <div class="data-layout">
                
                <div class="chart-box">
                    <div class="pane-title" style="align-self: flex-start; margin-bottom: 0.5rem;">Expense Allocation</div>
                    <canvas id="categoryChart" width="400" height="160"></canvas>
                </div>

                <div class="pane" style="padding: 1rem;">
                    <div class="table-toolbar">
                        <div class="pane-title" style="margin-bottom: 0;">Transaction Ledger</div>
                        <div class="filter-group">
                            <select id="filterType" class="form-control" onchange="renderApp()">
                                <option value="all">All Types</option>
                                <option value="income">Income Only</option>
                                <option value="expense">Expenses Only</option>
                            </select>
                        </div>
                    </div>

                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Description</th>
                                    <th>Category</th>
                                    <th>Type</th>
                                    <th style="text-align: right;">Amount</th>
                                    <th style="width: 50px;"></th>
                                </tr>
                            </thead>
                            <tbody id="ledgerBody">
                                </tbody>
                        </table>
                        <div id="emptyState" class="empty-state" style="display: none;">
                            No operational records logged for current filter criteria.
                        </div>
                    </div>
                </div>

            </div>
        </section>
    </div>

    <script>
        // Init state from LocalStorage or default architectural boilerplate setup
        let transactions = JSON.parse(localStorage.getItem('bizledger_txs')) || [
            { id: 1, date: '2026-05-01', desc: 'Enterprise Client Retainer', category: 'Consulting', type: 'income', amount: 4500.00 },
            { id: 2, date: '2026-05-03', desc: 'AWS Production Stack Cluster', category: 'Software', type: 'expense', amount: 840.00 },
            { id: 3, date: '2026-05-10', desc: 'SaaS Invoicing Platform Annual', category: 'Software', type: 'expense', amount: 290.00 },
            { id: 4, date: '2026-05-15', desc: 'Digital Ad Acquisition Campaign', category: 'Marketing', type: 'expense', amount: 1200.00 },
            { id: 5, date: '2026-05-20', desc: 'Stripe Merchant Payout Cluster', category: 'Sales', type: 'income', amount: 3250.00 }
        ];

        // Seed current date default form usability enhancement
        document.getElementById('txDate').valueAsDate = new Date();

        function syncStorage() {
            localStorage.setItem('bizledger_txs', JSON.stringify(transactions));
        }

        function formatCurrency(amount) {
            return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(amount);
        }

        function submitAs(type) {
            const form = document.getElementById('txForm');
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            const newTx = {
                id: Date.now(),
                date: document.getElementById('txDate').value,
                desc: document.getElementById('txDesc').value,
                category: document.getElementById('txCategory').value,
                type: type,
                amount: parseFloat(document.getElementById('txAmount').value)
            };

            transactions.unshift(newTx);
            syncStorage();
            renderApp();

            // Reset form fields statefully keeping structural fields intact
            document.getElementById('txDesc').value = '';
            document.getElementById('txAmount').value = '';
            document.getElementById('txDate').valueAsDate = new Date();
        }

        function deleteTransaction(id) {
            transactions = transactions.filter(tx => tx.id !== id);
            syncStorage();
            renderApp();
        }

        function exportCSV() {
            if(transactions.length === 0) return alert("No ledger data found to export.");
            
            let csvContent = "data:text/csv;charset=utf-8,Date,Description,Category,Type,Amount\n";
            transactions.forEach(tx => {
                csvContent += `"${tx.date}","${tx.desc.replace(/"/g, '""')}","${tx.category}","${tx.type}",${tx.amount}\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `bizledger_report_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Functional Calculation & DOM Pipeline Render Architecture
        function renderApp() {
            const ledgerBody = document.getElementById('ledgerBody');
            const emptyState = document.getElementById('emptyState');
            const filterType = document.getElementById('filterType').value;

            let totalRev = 0;
            let totalExp = 0;
            let expenseCategories = {};

            // Calculate Metrics Across Master Stack Data Stream Array
            transactions.forEach(tx => {
                if (tx.type === 'income') {
                    totalRev += tx.amount;
                } else {
                    totalExp += tx.amount;
                    expenseCategories[tx.category] = (expenseCategories[tx.category] || 0) + tx.amount;
                }
            });

            // Update Global Architectural Indicators
            document.getElementById('totalRevenue').innerText = formatCurrency(totalRev);
            document.getElementById('totalExpenses').innerText = formatCurrency(totalExp);
            
            const netProfitNode = document.getElementById('netProfit');
            const netValue = totalRev - totalExp;
            netProfitNode.innerText = formatCurrency(netValue);
            if (netValue >= 0) {
                netProfitNode.className = "card-value text-income";
            } else {
                netProfitNode.className = "card-value text-expense";
            }

            // UI Internal Component Table Processing View
            const filtered = transactions.filter(tx => filterType === 'all' || tx.type === filterType);
            ledgerBody.innerHTML = '';

            if (filtered.length === 0) {
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';
                filtered.forEach(tx => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="white-space: nowrap; color: var(--text-muted); font-size: 0.85rem;">${tx.date}</td>
                        <td style="font-weight: 500;">${tx.desc}</td>
                        <td><span style="color: var(--text-muted); font-size: 0.875rem;">${tx.category}</span></td>
                        <td><span class="tag tag-${tx.type}">${tx.type}</span></td>
                        <td style="text-align: right;" class="${tx.type === 'income' ? 'text-income' : 'text-expense'}">
                            ${tx.type === 'income' ? '+' : '-'}${formatCurrency(tx.amount)}
                        </td>
                        <td>
                            <button class="btn-delete" onclick="deleteTransaction(${tx.id})" title="Delete entry">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                            </button>
                        </td>
                    `;
                    ledgerBody.appendChild(tr);
                });
            }

            renderCanvasChart(expenseCategories);
        }

        // Lightweight Pure HTML5 Canvas Rendering Core Engine Implementation
        function renderCanvasChart(data) {
            const canvas = document.getElementById('categoryChart');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const categories = Object.keys(data);
            const values = Object.values(data);
            
            if (categories.length === 0) {
                ctx.fillStyle = '#94a3b8';
                ctx.font = '14px system-ui';
                ctx.textAlign = 'center';
                ctx.fillText('No expense data logged to visualize.', canvas.width / 2, canvas.height / 2);
                return;
            }

            const maxVal = Math.max(...values);
            const chartLeft = 120;
            const chartWidth = canvas.width - chartLeft - 40;
            const rowHeight = 24;
            const gap = 10;
            
            // Dynamic adjustment of canvas configuration based on payload density
            canvas.height = (categories.length * (rowHeight + gap)) + 20;

            const colors = ['#14b8a6', '#06b6d4', '#6366f1', '#3b82f6', '#a855f7', '#ec4899'];

            categories.forEach((cat, index) => {
                const val = data[cat];
                const widthMultiplier = maxVal > 0 ? (val / maxVal) : 0;
                const barWidth = chartWidth * widthMultiplier;
                const y = index * (rowHeight + gap) + 15;

                // Category Text Label Rendering
                ctx.fillStyle = '#94a3b8';
                ctx.font = '12px system-ui';
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                ctx.fillText(cat, chartLeft - 10, y + (rowHeight / 2));

                // Clean Modern Data Bar Drawing Profile
                ctx.fillStyle = colors[index % colors.length];
                ctx.beginPath();
                ctx.roundRect ? ctx.roundRect(chartLeft, y, barWidth, rowHeight, 4) : ctx.rect(chartLeft, y, barWidth, rowHeight);
                ctx.fill();

                // Structural Value Label Overlay
                ctx.fillStyle = '#f8fafc';
                ctx.font = 'bold 11px system-ui';
                ctx.textAlign = 'left';
                ctx.fillText(formatCurrency(val), chartLeft + Math.max(barWidth + 8, 10), y + (rowHeight / 2));
            });
        }

        // Initialization execution target bootstrapper sequence
        window.onload = function() {
            renderApp();
        };
    </script>
</body>
</html>
